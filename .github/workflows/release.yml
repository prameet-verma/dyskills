name: Release

# Publishing is a human gate: the `npm` environment requires approval, and nothing here runs on a
# branch push. `workflow_dispatch` defaults to a dry run.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run `publish --dry-run` instead of publishing
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Check the release
        if: github.event_name != 'workflow_dispatch'
        run: pnpm exec tsx scripts/check-release.ts --tag "$GITHUB_REF_NAME"
      - name: Publish
        run: pnpm --filter dynamic-skills publish --provenance --access public --no-git-checks ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
